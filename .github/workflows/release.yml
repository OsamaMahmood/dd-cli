name: Release

# Fires on any tag matching v*. Builds sdist + wheel, generates a
# SHA256SUMS file, and creates a GitHub Release with auto-generated notes.
# PyPI / Docker Hub / Homebrew publish lives in M5 — this workflow is
# scoped to GitHub Releases only.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required for `gh release create` and asset upload

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build sdist + wheel and create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs needs the full tag history to compute the version.
          fetch-depth: 0

      - name: Verify tag points at a commit reachable from main
        # Catches the "tag pushed from a stale feature branch" footgun that
        # produced an empty changelog for v0.4.0 — see RELEASING.md. Every
        # release tag must be a descendant of the merge commit on main.
        run: |
          TAG_SHA=$(git rev-parse "$GITHUB_REF")
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $TAG_SHA, which is not"
            echo "::error::an ancestor of origin/main. Re-tag from a fully-pulled"
            echo "::error::main checkout — see RELEASING.md."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME → $TAG_SHA is reachable from main."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist + wheel
        run: python -m build --outdir dist/

      - name: Verify wheel installs and `dd --version` matches the tag
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --upgrade pip
          /tmp/verify/bin/pip install dist/*.whl
          BUILT_VERSION=$(/tmp/verify/bin/dd --version | awk '{print $2}')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag-derived version: $TAG_VERSION"
          echo "wheel version:       $BUILT_VERSION"
          if [ "$BUILT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch — built wheel reports $BUILT_VERSION but tag is v$TAG_VERSION"
            exit 1
          fi

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          shasum -a 256 *.whl *.tar.gz > SHA256SUMS
          echo "=== artifacts ==="
          ls -la
          echo
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Pick prerelease + latest flags from tag shape
        id: release_flags
        # Tags with a `-` (e.g. v1.0.0-rc.1) are prereleases — never marked
        # latest. Stable tags (e.g. v0.4.0) get --latest=true explicitly so
        # GitHub doesn't fall back to the publishedAt-time heuristic that
        # left v0.2.0 incorrectly tagged as Latest after a backfill.
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "flags=--prerelease --latest=false" >> "$GITHUB_OUTPUT"
            echo "Detected prerelease tag: $GITHUB_REF_NAME"
          else
            echo "flags=--latest=true" >> "$GITHUB_OUTPUT"
            echo "Stable tag — will mark as Latest: $GITHUB_REF_NAME"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ${{ steps.release_flags.outputs.flags }} \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS

      - name: Upload built artifacts for the publish-pypi job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI via OIDC trusted publisher
    needs: build-and-release
    runs-on: ubuntu-latest
    # The `pypi` environment must exist in repo Settings → Environments and
    # be linked to the dd-cli project on PyPI as a trusted publisher.
    # See RELEASING.md for the one-time PyPI setup.
    environment:
      name: pypi
      url: https://pypi.org/project/dd-cli/
    permissions:
      id-token: write   # required for OIDC token minting
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Drop non-package files before twine upload
        # SHA256SUMS sits in dist/ alongside the wheel/sdist for the GH
        # Release; twine doesn't know what to do with it.
        run: |
          rm -f dist/SHA256SUMS
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # The trusted publisher expects no explicit token — the action
          # uses the OIDC id-token from the runner.
          skip-existing: false   # fail loudly if version already exists

  publish-docker:
    name: Publish multi-arch image to ghcr.io + Docker Hub
    needs: build-and-release
    runs-on: ubuntu-latest
    environment:
      name: docker
      url: https://github.com/OsamaMahmood/dd-cli/pkgs/container/dd-cli
    permissions:
      contents: read
      packages: write   # GHCR push
    steps:
      - uses: actions/checkout@v4
        with:
          # docker build needs the .git dir for hatch-vcs; same as build-and-release.
          fetch-depth: 0

      - name: Compute image tags
        id: tags
        # Stable tag (v1.2.3): produces 1.2.3, 1.2, 1, latest
        # Prerelease tag (v2.0.0-rc.1): produces 2.0.0-rc.1 only — no
        # latest, no truncated semver aliases (those should always point
        # at a stable release).
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          GHCR_IMAGE="ghcr.io/osamamahmood/dd-cli"
          DH_IMAGE="osamamahmood/dd-cli"

          if [[ "$TAG" == *-* ]]; then
            # Prerelease — exact version only
            tags="${GHCR_IMAGE}:${TAG},${DH_IMAGE}:${TAG}"
          else
            # Stable — full set of aliases
            MAJOR="${TAG%%.*}"
            MINOR="${TAG%.*}"
            tags="${GHCR_IMAGE}:${TAG},${GHCR_IMAGE}:${MINOR},${GHCR_IMAGE}:${MAJOR},${GHCR_IMAGE}:latest"
            tags="${tags},${DH_IMAGE}:${TAG},${DH_IMAGE}:${MINOR},${DH_IMAGE}:${MAJOR},${DH_IMAGE}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Computed tags:"
          echo "$tags" | tr ',' '\n' | sed 's/^/  /'

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Cache between runs to keep arm64 builds reasonable.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Useful provenance for vulnerability scanners.
          provenance: true
          sbom: true
