site_name: dd-cli
site_description: Production-grade CLI for managing DefectDojo
site_url: https://osamamahmood.github.io/dd-cli/
repo_name: OsamaMahmood/dd-cli
repo_url: https://github.com/OsamaMahmood/dd-cli
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Osama Mahmood — BSD 3-Clause

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - mkdocs-click
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Configuration: configuration.md
  - Importing findings: importing-findings.md
  - Migration from dd-import: migration.md
  - CLI reference: cli-reference.md
  - CI recipes:
      - GitHub Actions: recipes/github-actions.md
      - GitLab CI: recipes/gitlab-ci.md
  - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/OsamaMahmood/dd-cli
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/dd-cli/
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/m4rkm3n/dd-cli
